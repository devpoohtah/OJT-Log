
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task History | InternLog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <h2>IL <span>InternLog</span></h2>

    <nav>
      <a href="dashboard.html">My Tasks</a>
      <a href="add-task.html">Add New Task</a>
      <a class="active" href="history.html">Task History</a>
      <a href="dtr.html">Daily Time Record</a>
    </nav>

    <button id="logout" class="logout">Sign Out</button>
  </aside>

  <main class="main">

    <header>
      <div>
        <h1>Task History</h1>
        <p class="muted">All your recorded internship activities.</p>
      </div>

      <a href="add-task.html" class="btn primary">
        + Add Daily Log
      </a>
    </header>

    <section class="panel">

      <input
        type="search"
        id="search"
        placeholder="Search activities, descriptions, categories or dates..."
      >

      <div class="table-container">
        <table class="history-table">

          <thead>
            <tr>
              <th>Duty Date</th>
              <th>Activities Completed</th>
              <th>Description</th>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="historyTableBody">
            <tr>
              <td colspan="5" class="empty-state">
                Loading task history...
              </td>
            </tr>
          </tbody>

        </table>
      </div>

      <div class="history-footer">
        <p id="historyCount" class="muted">Loading...</p>

        <div class="pagination">
          <button id="prevPage" class="page-btn" disabled>
            Previous
          </button>

          <span id="pageInfo">Page 1 of 1</span>

          <button id="nextPage" class="page-btn" disabled>
            Next
          </button>
        </div>
      </div>

    </section>

  </main>
</div>

<!-- EDIT ACTIVITY MODAL -->

<div id="editModal" class="modal-overlay" hidden>

  <div class="edit-modal">

    <div class="modal-heading">
      <div>
        <h2>Edit Activity</h2>
        <p class="muted">Update your internship activity.</p>
      </div>

      <button type="button" id="closeModal" class="modal-close">
        &times;
      </button>
    </div>

    <form id="editForm">

      <label for="editDate">Duty Date</label>
      <input type="date" id="editDate" required>

      <label for="editTitle">Task Title</label>
      <input
        type="text"
        id="editTitle"
        placeholder="Enter activity title"
        required
      >

      <label for="editDescription">Description</label>
      <textarea
        id="editDescription"
        rows="4"
        placeholder="Describe your activity..."
        required
      ></textarea>

      <label for="editCategory">Category</label>
      <input
        type="text"
        id="editCategory"
        placeholder="Enter category"
      >

      <p id="editMessage" class="form-message"></p>

      <div class="modal-actions">
        <button type="button" id="cancelEdit" class="btn secondary">
          Cancel
        </button>

        <button type="submit" id="saveEdit" class="btn primary">
          Save Changes
        </button>
      </div>

    </form>

  </div>
</div>

<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/history.js"></script>

</body>
</html>
