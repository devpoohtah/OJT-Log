
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Daily Log | OJT Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <h2><span>OJT Tracker</span></h2>
    <nav>
      <a href="dashboard.html">My Tasks</a>
      <a class="active" href="add-task.html">Add Daily Log</a>
      <a href="history.html">Task History</a>
      <a href="dtr.html">DTR</a>
      <a href="dtr-records.html">DTR History</a>
    </nav>
    <button id="logout" class="logout">Sign Out</button>
  </aside>

  <main class="main">

    <header>
      <div>
        <h1>Add Daily Log</h1>
        <p class="muted">Record your internship tasks for the day.</p>
      </div>
    </header>

    <section class="panel form-panel">

      <form id="taskForm">

        <h2>Daily Information</h2>

        <label for="date">Duty Date</label>
        <input type="date" id="date" required>

        <label for="dayKnowledge">Knowledge/Skills Acquired <span class="muted">(optional, for the whole day)</span></label>
        <textarea id="dayKnowledge" rows="3" placeholder="What did you learn on this day? It appears in your weekly report."></textarea>

        <hr class="divider">

        <h2>Tasks Completed</h2>
        <p class="muted">Add all the tasks you accomplished during your duty.</p>

        <div id="taskContainer">

          <div class="task-entry">
            <div class="task-entry-header">
              <strong class="task-number">Task 1</strong>
            </div>

            <label>Task Title</label>
            <input type="text" name="title"
              placeholder="e.g. Set up PC" maxlength="120" required>

            <label>Description</label>
            <textarea name="description" rows="4"
              placeholder="Describe what you accomplished..."
              maxlength="3000" required></textarea>

            <label>Category (Optional)</label>
            <select name="category">
              <option value="">No category</option>
              <option value="Technical">Technical</option>
              <option value="Development">Development</option>
              <option value="Documentation">Documentation</option>
              <option value="Administrative">Administrative</option>
              <option value="Research">Research</option>
              <option value="Meetings">Meetings</option>
              <option value="Other">Other</option>
            </select>
          </div>

        </div>

        <button type="button" id="addTaskBtn" class="add-task-btn">
          + Add Another Task
        </button>

        <div class="actions">
          <a href="dashboard.html" id="cancelLink" class="btn secondary">Cancel</a>
          <button type="submit" id="saveButton" class="btn primary">
            Save Daily Log
          </button>
        </div>

        <p id="formMessage" class="message"></p>

      </form>

    </section>
  </main>
</div>

<script type="module" src="js/sidebar.js"></script>
<script type="module" src="js/add-task.js"></script>

</body>
</html>
